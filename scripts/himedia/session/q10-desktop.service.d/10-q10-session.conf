# Q10 session switcher: desktop is one of three mutually exclusive sessions.
[Unit]
Requires=q10-video-stack.service
After=q10-video-stack.service
Conflicts=q10-kodi.service q10-web.service

[Service]
# A system unit has no HOME: startlxqt then put its whole config under /.config and ignored
# /root/.config (2026-10-12).
Environment=HOME=/root USER=root
ExecStopPost=-/usr/local/sbin/q10-mode exited desktop
# cage (Android, kept alive while paused) reserves X display :0 for its Xwayland, so the desktop
# takes the first free display instead of a fixed :0 (2026-10-12).
ExecStart=
ExecStart=/usr/local/lib/q10-session/q10-desktop-start
