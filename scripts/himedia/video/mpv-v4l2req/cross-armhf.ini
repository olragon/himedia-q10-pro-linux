# meson cross file: Debian trixie container -> ARMv7 hard-float NEON (Q10 Pro, Hi3798CV200).
[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'
exe_wrapper = 'qemu-arm-static'

[properties]
needs_exe_wrapper = true
sys_root = '/'
# armhf multiarch libs first, then our FFmpeg (installed at its box path inside the container)
pkg_config_libdir = ['/opt/ffmpeg-v4l2req/lib/pkgconfig', '/usr/lib/arm-linux-gnueabihf/pkgconfig', '/usr/share/pkgconfig']

[built-in options]
c_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard', '-O2']
c_link_args = ['-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard', '-Wl,-rpath,/opt/ffmpeg-v4l2req/lib']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
