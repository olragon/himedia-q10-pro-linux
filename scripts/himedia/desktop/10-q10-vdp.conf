# Xorg on the Q10's HDMI through the VDP display controller (histb-vdp, patches 0011/0012):
# real KMS planes, scan-out from CMA, and glamor on the Mali-T720 (Mesa panfrost, GLES2) via the
# render node. Addressed by platform path: card numbers follow module load order.
# BusID is required: with panfrost's card0 present too, Xorg otherwise stops with
# "Cannot run in framebuffer mode. Please specify busIDs for all framebuffer devices".
Section "Device"
    Identifier "q10-hdmi"
    Driver     "modesetting"
    BusID      "platform:/sys/devices/platform/soc@f0000000/f8cc0000.display-controller"
    Option     "kmsdev"      "/dev/dri/by-path/platform-f8cc0000.display-controller-card"
    Option     "AccelMethod" "glamor"
EndSection

Section "ServerFlags"
    # the GPU (card0) is a render-only device: never try to drive it as a second screen
    Option "AutoAddGPU" "false"
EndSection
