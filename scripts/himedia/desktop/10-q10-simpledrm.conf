# Xorg on the Q10's HDMI: simpledrm (/dev/dri/card0) over the boot-logo scan-out buffer,
# 1920x1080 ARGB8888. No GPU driver yet, so no glamor: pixman software rendering.
Section "Device"
    Identifier "q10-hdmi"
    Driver     "modesetting"
    Option     "kmsdev"      "/dev/dri/card0"
    Option     "AccelMethod" "none"
EndSection
