# /etc/modprobe.d/q10-vdp.conf — histb_vdp module options (2026-10-12)
# allow_scale=1: the V0 video plane scales through the VDP ZME. Without it any video that is not
# exactly the display size (Kodi 720p on a 1080p mode) gets ERANGE on every atomic test commit and
# Kodi silently re-shows the last good frame. Commit acceptance and ZME register programming are
# verified (V0_IRESO 1280x720 -> V0_ORESO 1920x1080); the PICTURE QUALITY of the scaled output is
# not — the ZME coefficient tables are unverified (needs a look at the TV).
options histb_vdp allow_scale=1
