# Q10: drivers for hardware bring-up that has NOT been proven on this box yet. Their device-tree
# nodes are enabled, so without this udev would auto-load them at boot from the modalias — and a
# first register read that hangs the bus would then hang EVERY boot. Load by hand, watchdog armed:
#   q10-modprobe-guarded histb_vpss 60 5; q10-modprobe-guarded histb_vdec 60 5; q10-modprobe-guarded panfrost 60 10
# Remove a line only after that driver has been proven (then it may auto-load).
blacklist histb_vdec
blacklist histb_vpss
blacklist panfrost
blacklist histb_vdp
# HDMI transmitter bridge (display modes, 2026-10-12): the DT node is enabled, so udev would auto-load
# it at boot from the modalias (udev runs `modprobe -b`, which honours this blacklist). Its probe is
# read-only, but it stays out of the boot path until the mode switch is proven. Nobody needs to load it
# by hand: histb_vdp declares MODULE_SOFTDEP("pre: histb_hdmi") and a plain `modprobe histb_vdp` (the
# guarded one in q10-video-stack) loads it first - softdeps are loaded by name, which a blacklist
# does not stop.
blacklist histb_hdmi
