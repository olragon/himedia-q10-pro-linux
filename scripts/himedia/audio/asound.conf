# /etc/asound.conf — Q10: a software "Master" volume on the default device.
# q10_aiao exposes no mixer controls (amixer scontrols is empty), so desktop volume widgets had
# nothing to drive. softvol creates the "Master" control on first open of `default`.
# dmix lets two desktop apps play at once. Kodi and PipeWire open the card directly (hw/sysdefault)
# and keep their own volume, so this changes nothing for them.
pcm.q10dmix {
    type dmix
    ipc_key 10101
    slave { pcm "hw:Q10,0" rate 48000 format S16_LE }
}
pcm.!default {
    type plug
    slave.pcm "q10softvol"
}
pcm.q10softvol {
    type softvol
    slave.pcm "q10dmix"
    control { name "Master" card Q10 }
    min_dB -51.0
    max_dB 0.0
}
ctl.!default {
    type hw
    card Q10
}
